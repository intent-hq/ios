name: Export UI evidence
description: Retain allowlisted fixture screenshots, recovery records, and missing-capture diagnostics
inputs:
  bundles:
    description: Result bundle paths, one per line; retry bundles are included automatically
    required: true
  artifact-suffix:
    description: Suffix for artifact names when multiple UI jobs export evidence
    default: ''
runs:
  using: composite
  steps:
    - name: Export fixture attachments
      id: evidence
      continue-on-error: true
      shell: bash
      env:
        EVIDENCE_BUNDLES: ${{ inputs.bundles }}
      run: >-
        python3 scripts/export_ui_evidence.py
        --output-root "$RUNNER_TEMP/ui-evidence-$GITHUB_JOB"
        --bundles "$EVIDENCE_BUNDLES"

    - name: Upload review screenshots
      if: always() && steps.evidence.outputs.review_available == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ios-ui-review-evidence${{ inputs.artifact-suffix }}
        path: ${{ runner.temp }}/ui-evidence-${{ github.job }}/review
        retention-days: 14
        if-no-files-found: ignore

    - name: Upload agent group screenshots
      if: always() && steps.evidence.outputs.agent-groups_available == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ios-agent-group-evidence${{ inputs.artifact-suffix }}
        path: ${{ runner.temp }}/ui-evidence-${{ github.job }}/agent-groups
        retention-days: 14
        if-no-files-found: ignore

    - name: Upload transcript recovery evidence
      if: always() && steps.evidence.outputs.recovery_available == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ios-transcript-recovery-evidence${{ inputs.artifact-suffix }}
        path: ${{ runner.temp }}/ui-evidence-${{ github.job }}/recovery
        retention-days: 14
        if-no-files-found: ignore
