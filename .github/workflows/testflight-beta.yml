name: TestFlight internal Beta

'on':
  schedule:
    # Native IANA scheduling follows PST/PDT; never filter by runner start time.
    # GitHub can delay or drop scheduled runs, especially at the top of the hour.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: '0 16 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      mode:
        description: Preview is read-only. Apply also requires separately approved activation.
        type: choice
        options: [preview, apply]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  # Share one lock across schedule, dispatch, and reruns; never cancel a write.
  group: testflight-internal-beta
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check activation before accessing credentials
        id: gate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMOTION_MODE: ${{ inputs.mode }}
          # Fresh opt-in: never reuse the superseded external-Alpha approval.
          TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED: ${{ vars.TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          mode=skip
          message='Run this workflow from the default branch only.'
          if [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            case "$GITHUB_EVENT_NAME" in
              schedule) mode=apply ;;
              workflow_dispatch) mode="${PROMOTION_MODE:-preview}" ;;
              *) echo 'Unsupported event; no App Store Connect access.' >&2; exit 1 ;;
            esac
            case "$mode" in
              preview) message='Read-only preview; no changes will be made.' ;;
              apply)
                if [[ "$TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED" == 'true' ]]; then
                  message='Live assignment enabled by the separately approved repository variable.'
                else
                  mode=skip
                  message='Live promotion is disabled. Review a manual preview and obtain explicit approval before setting TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED to true.'
                fi
                ;;
              *) echo 'Unsupported mode; no App Store Connect access.' >&2; exit 1 ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          printf '## TestFlight internal Beta gate\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$message"

      - name: Checkout
        if: steps.gate.outputs.mode == 'preview' || steps.gate.outputs.mode == 'apply'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preview or assign the newest eligible iOS build
        if: steps.gate.outputs.mode == 'preview' || steps.gate.outputs.mode == 'apply'
        env:
          PROMOTION_MODE: ${{ steps.gate.outputs.mode }}
          TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED: ${{ vars.TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_SOURCE_GROUP_ID: ${{ vars.ASC_SOURCE_GROUP_ID }}
          ASC_DESTINATION_GROUP_ID: ${{ vars.ASC_DESTINATION_GROUP_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import tempfile

          def stopped(signum, _frame):
              # Unwind TemporaryDirectory even when the runner cancels this step.
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, stopped)
          signal.signal(signal.SIGINT, stopped)
          outcome = {"result": "error", "action": "Workflow setup failed; check credential configuration without printing secret values."}
          status = 1
          try:
              mode = os.environ.get("PROMOTION_MODE")
              if mode not in ("preview", "apply") or (
                  mode == "apply" and os.environ.get("TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED") != "true"
              ):
                  raise ValueError
              key = os.environ.pop("ASC_PRIVATE_KEY", "")
              if not all((key, os.environ.get("ASC_KEY_ID"), os.environ.get("ASC_ISSUER_ID"))):
                  raise ValueError
              # mkdtemp/mkstemp create owner-only 0700/0600 paths, not predictable
              # shared files. The raw key never reaches argv, logs, or child env.
              with tempfile.TemporaryDirectory(prefix="testflight-key-", dir=os.environ["RUNNER_TEMP"]) as directory:
                  with tempfile.NamedTemporaryFile(mode="w", dir=directory, suffix=".p8", delete=False) as private_key:
                      private_key.write(key)
                      key_path = private_key.name
                  del key
                  child_env = dict(os.environ, ASC_PRIVATE_KEY_PATH=key_path)
                  completed = subprocess.run(
                      [sys.executable, "scripts/promote_testflight.py", "--apply" if mode == "apply" else "--dry-run"],
                      env=child_env, capture_output=True, text=True, timeout=480, check=False,
                  )
                  # Only the promotion script's sanitized JSON is published, never
                  # stderr or a traceback. Preserve its nonzero exit on failure.
                  outcome = json.loads(completed.stdout)
                  if not isinstance(outcome, dict) or not {"result", "action"} <= outcome.keys():
                      raise ValueError
                  status = completed.returncode
          except subprocess.TimeoutExpired:
              outcome = {"result": "error", "action": "Promotion timed out; assignment may be uncertain. Run a read-only preview before retrying."}
          except Exception:
              outcome = {"result": "error", "action": "Workflow setup or script output failed. Check credentials and run a read-only preview before retrying; no unsafe details were logged."}
          print(json.dumps(outcome, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n## TestFlight internal Beta result\n\n```json\n" + json.dumps(outcome, indent=2) + "\n```\n\n")
              summary.write("A successful job is not proof of tester availability. Verify Internal Testing > Beta, compliance, What to Test, and tester access. Confirm Beta automatic distribution is off before activation.\n")
          if outcome["result"] in ("blocked", "assigned_pending_testing", "assigned_but_blocked"):
              print("::warning::Internal testing needs attention; see the action in the job summary.")
          sys.exit(status)
          PY