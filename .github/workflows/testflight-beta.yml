name: TestFlight internal Beta

'on':
  schedule:
    # Native IANA scheduling follows PST/PDT; never filter by runner start time.
    # GitHub can delay or drop scheduled runs, especially at the top of the hour.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: '0 16 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      mode:
        description: Preview is read-only. Apply also requires separately approved activation.
        type: choice
        options: [preview, apply]
        default: preview
        required: true
      publish_mode:
        description: Publish frozen notes only with separate repository approval; schedule retains intent for later delivery.
        type: choice
        options: [preview, publish]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  # Share one lock across schedule, dispatch, and reruns; never cancel a write.
  group: testflight-internal-beta
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # Original intent recovery only; no repository publisher.
    outputs:
      source_run: ${{ steps.recover.outputs.source_run || github.run_id }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Check activation before accessing credentials
        id: gate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMOTION_MODE: ${{ inputs.mode }}
          # Fresh opt-in: never reuse the superseded external-Alpha approval.
          TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED: ${{ vars.TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          mode=skip
          message='Run this workflow from the default branch only.'
          if [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            case "$GITHUB_EVENT_NAME" in
              schedule) mode=apply ;;
              workflow_dispatch) mode="${PROMOTION_MODE:-preview}" ;;
              *) echo 'Unsupported event; no App Store Connect access.' >&2; exit 1 ;;
            esac
            case "$mode" in
              preview) message='Read-only preview; no changes will be made.' ;;
              apply)
                if [[ "$TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED" == 'true' ]]; then
                  message='Live assignment enabled by the separately approved repository variable.'
                else
                  mode=skip
                  message='Live promotion is disabled. Review a manual preview and obtain explicit approval before setting TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED to true.'
                fi
                ;;
              *) echo 'Unsupported mode; no App Store Connect access.' >&2; exit 1 ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          printf '## TestFlight internal Beta gate\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$message"

      - name: Checkout
        if: steps.gate.outputs.mode == 'preview' || steps.gate.outputs.mode == 'apply'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false

      # Source history is read by Git only; no app build, package install, Xcode
      # Cloud hook or script from a candidate revision is ever executed.
      - name: Select the newest eligible iOS build
        id: select
        if: steps.gate.outputs.mode == 'preview' || steps.gate.outputs.mode == 'apply'
        env:
          PROMOTION_PHASE: select
          PROMOTION_MODE: ${{ steps.gate.outputs.mode }}
          TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED: ${{ vars.TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_SOURCE_GROUP_ID: ${{ vars.ASC_SOURCE_GROUP_ID }}
          ASC_DESTINATION_GROUP_ID: ${{ vars.ASC_DESTINATION_GROUP_ID }}
        shell: bash
        run: python3 scripts/testflight_workflow.py

      - name: Recover original intent without Apple credentials
        id: recover
        if: steps.gate.outputs.mode == 'preview' || steps.gate.outputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/testflight_artifacts.py

      - name: Preview exact notes or reconcile original intent
        id: prepare
        if: steps.gate.outputs.mode == 'preview' || steps.gate.outputs.mode == 'apply'
        env:
          PROMOTION_PHASE: prepare
          PROMOTION_MODE: ${{ steps.gate.outputs.mode }}
          TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED: ${{ vars.TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_SOURCE_GROUP_ID: ${{ vars.ASC_SOURCE_GROUP_ID }}
          ASC_DESTINATION_GROUP_ID: ${{ vars.ASC_DESTINATION_GROUP_ID }}
        run: python3 scripts/testflight_workflow.py

      # A durable original payload must exist before the first Apple write.
      # Preview has NO artifact uploads (and no GitHub repository writes).
      - name: Checkpoint original intent before Apple writes
        id: checkpoint
        if: steps.gate.outputs.mode == 'apply' && steps.prepare.outputs.fresh_plan == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testflight-beta-intent-${{ steps.select.outputs.build_id }}
          path: ${{ runner.temp }}/testflight/intent.json
          retention-days: 90
          if-no-files-found: error

      - name: Verify notes then append to Beta
        if: steps.gate.outputs.mode == 'apply' && steps.prepare.outputs.fresh_plan == 'true' && steps.checkpoint.outputs.artifact-id != ''
        env:
          PROMOTION_PHASE: apply
          PROMOTION_MODE: ${{ steps.gate.outputs.mode }}
          CHECKPOINT_ID: ${{ steps.checkpoint.outputs.artifact-id }}
          TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED: ${{ vars.TESTFLIGHT_INTERNAL_BETA_PROMOTION_ENABLED }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_SOURCE_GROUP_ID: ${{ vars.ASC_SOURCE_GROUP_ID }}
          ASC_DESTINATION_GROUP_ID: ${{ vars.ASC_DESTINATION_GROUP_ID }}
        run: python3 scripts/testflight_workflow.py

      - name: Retain independent notes and assignment observations
        if: always() && steps.gate.outputs.mode == 'apply'
        uses: actions/upload-artifact@v7
        with:
          name: testflight-beta-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/testflight/intent.json
            ${{ runner.temp }}/testflight/journal.json
          retention-days: 90
          if-no-files-found: ignore

  deliver:
    needs: promote
    if: needs.promote.outputs.mode == 'apply' && inputs.publish_mode == 'publish' && vars.RELEASE_NOTES_PUBLICATION_ENABLED == 'true' && github.run_attempt == 1 && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/release-notes-publish.yml
    with:
      mode: publish
      source_run: ${{ needs.promote.outputs.source_run }}
      channel: beta