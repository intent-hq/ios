name: App Store release check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print version bumps and exact-commit tags without creating anything
        type: boolean
        default: true

permissions:
  contents: read

# One writer across scheduled and manual runs; separate from TestFlight uploads.
concurrency:
  group: marketing-version-bump
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      bump_plan: ${{ steps.check.outputs.bump_plan }}
      release_tags: ${{ steps.check.outputs.release_tags }}
    # Feature branches can exercise the real Apple query, but only the default
    # branch may write the shared automation branch.
    if: github.ref_name == github.event.repository.default_branch || inputs.dry_run
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      VERSION_BUMP_BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Read-only token also authenticates ls-remote for this private repo.
          persist-credentials: true
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Release contract tests
        run: |
          bundle exec ruby scripts/test-version-bump.rb
          bundle exec ruby scripts/test-app-store-release.rb
      - name: Check both App Store versions
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: bundle exec fastlane ios check_version_bump dry_run:"$DRY_RUN" publish:false

  publish-bump:
    needs: check-version
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
      needs.check-version.outputs.bump_plan != 'null'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Existing PR writer needs both permissions; no Apple credentials here.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Optional token allows this PR to trigger CI; fallback cannot.
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Open or update version-bump PR
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}
          VERSION_BUMP_BASE: ${{ github.event.repository.default_branch }}
          BUMP_PLAN: ${{ needs.check-version.outputs.bump_plan }}
        run: bundle exec ruby -rfastlane -r./fastlane/lib/version_bump -e 'VersionBump.publish(JSON.parse(ENV.fetch("BUMP_PLAN"), symbolize_names:true))'

  tag-release:
    needs: check-version
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
      needs.check-version.outputs.release_tags != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub scopes tokens per job, not per step: only this tag publisher gets
    # tag-write access. The independent PR writer above has its existing access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Create annotated App Store release tags
        env:
          RELEASE_TAGS: ${{ needs.check-version.outputs.release_tags }}
        run: bundle exec ruby -rfastlane -r./fastlane/lib/app_store_release -e 'AppStoreRelease.publish(JSON.parse(ENV.fetch("RELEASE_TAGS"), symbolize_names:true), dry_run:false)'
