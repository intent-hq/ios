name: CI
# No push-to-main trigger: the repo ruleset requires PR branches to be up to
# date with main before merging, so the squash commit that lands on main has
# the identical tree the PR CI just tested. A post-merge re-run adds no signal.
# Caches are seeded on main by warm-cache.yml instead: a PR can only restore
# caches created on its own merge ref or on main, so without that seeding
# every PR's first run started cold.
# workflow_dispatch adds a filtered lane for iteration: `only_testing` narrows
# the test step via ONLY_TESTING and renames the macOS job to
# "iOS Filtered Tests (non-gating)", so a filtered green can never satisfy
# the ruleset-required "iOS Build & Test" check. pull_request runs never
# receive a filter.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      only_testing:
        description: >-
          Whitespace-separated Target[/Suite[/test]] identifiers passed to
          ONLY_TESTING (e.g. 'IntentTests/DemoFixturesTests'; a file name is
          not a selector). Each must resolve to enumerated tests or the job
          fails with exit 82 (83 when the selection cannot be verified); the
          per-selector table lands in the job summary. Empty runs the full
          bundle.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read
  # Stable gates reconcile the latest job attempts as well as needs results.
  actions: read

env:
  # The producer validates and exports this ONE count for matrix, workers and gate.
  UI_TEST_SHARD_COUNT: '6'

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go unit tests (TailcatKit)
    # TailcatKit is pure Go and cross-compiles for Linux, so its tests run
    # here on a cheap, fast Linux runner instead of serialising 2-12 minutes
    # of Tailscale compilation onto the 3-core macOS VM.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: TailcatKit/go.mod
          cache-dependency-path: TailcatKit/go.sum

      - name: Go unit tests
        working-directory: TailcatKit
        run: go test -timeout 300s ./...

      # Exercises the simulator lock and crash classification in
      # scripts/xcodebuild.sh against stubbed xcrun/xcodebuild; needs bash + python3.
      - name: xcodebuild.sh self-tests
        run: scripts/test_xcodebuild.sh

      - name: UI shard gate self-tests
        run: python3 scripts/test-ui-test-shards.py

      - name: Hosted test handoff self-tests
        run: python3 scripts/test-ci-test-handoff.py

      # Exercises the version pin, argument contract and SWIFTLINT_REPORTER
      # override in scripts/swiftlint.sh against a stubbed swiftlint; pure bash.
      - name: swiftlint.sh self-tests
        run: scripts/test-swiftlint.sh

      # Exercises the xcfilelist drift check in scripts/check-swiftlint-inputs.sh
      # against a fixture git repo (missing, stale, unsorted, pruned entries);
      # pure bash + git.
      - name: check-swiftlint-inputs.sh self-tests
        run: scripts/test-check-swiftlint-inputs.sh

      # Exercises source-input generation and validation on Linux; the script's
      # sandbox-exec cases remain conditional and run only on macOS.
      - name: generate-test-inputs.sh self-tests
        run: scripts/test-generate-test-inputs.sh

  swiftlint:
    name: SwiftLint
    # Runs unconditionally on both triggers so the build-and-test gate never
    # sees a skipped lint job. The official
    # Linux release uses its in-process sourcekitd, so lint needs no macOS,
    # Xcode, Go, SPM or simulator work.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Xcode lint phase only warns and skips diagnostics when
      # scripts/swiftlint-xcode-inputs.xcfilelist drifts from the tracked Swift
      # sources; this strict check keeps that drift merge-blocking (ios#384).
      - name: Check SwiftLint Xcode input list
        run: scripts/check-swiftlint-inputs.sh

      # scripts/swiftlint.sh rejects any version but the pinned one, so
      # install exactly the official Linux release asset rather than whatever
      # the image preinstalls.
      # The sha256 is the release asset's; recompute it from a fresh download
      # when bumping the version.
      - name: Install SwiftLint 0.65.1
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o swiftlint_linux_amd64.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint_linux_amd64.zip" | sha256sum -c -
          mkdir -p swiftlint
          unzip -q swiftlint_linux_amd64.zip -d swiftlint
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      # The wrapper passes --strict --no-cache and enforces the version pin;
      # the reporter override renders violations as PR annotations.
      - name: SwiftLint
        env:
          SWIFTLINT_REPORTER: github-actions-logging
        run: scripts/swiftlint.sh

  ios-test-build:
    name: iOS Test Build
    # Paid GitHub-hosted M2 arm64 producer; repository access must be confirmed
    # before publication. No self-hosted/standard fallback or access probe run.
    # This job NEVER waits for or executes tests: upload, finish, then fan out.
    runs-on: macos-15-xlarge
    timeout-minutes: 45
    outputs:
      run: ${{ steps.configure.outputs.run }}
      revision: ${{ steps.configure.outputs.revision }}
      artifact: ${{ steps.configure.outputs.artifact }}
      context: ${{ steps.configure.outputs.context }}
      count: ${{ steps.configure.outputs.count }}
      matrix: ${{ steps.configure.outputs.matrix }}
      sha256: ${{ steps.publish.outputs.sha256 }}
      echo-sha256: ${{ steps.publish.outputs.echo_sha256 }}
    env:
      GIT_TERMINAL_PROMPT: '0'
      SPM_CLONE_DIR: build/SourcePackages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Record git HEAD, not PR-head SHA: checkout normally uses the merge tree.
      # Consumers find this EXACT Xcode version/build and runtime ID/version/build.
      - name: Configure trusted producer identity and platform
        id: configure
        run: python3 scripts/ci-test-handoff.py configure

      # The gomobile bind output (and the tcecho helper binary) are
      # deterministic for a given wrapper source + module graph + Go
      # toolchain, so cache them on a hash of those inputs. go.mod is
      # included because it picks the toolchain (setup-go go-version-file)
      # and module versions. On a hit the job never needs Go at all, which
      # skips the multi-minute toolchain download and the 800 MB Go cache
      # restore/save. warm-cache.yml seeds this cache on main.
      - name: Cache TailcatKit.xcframework
        id: tailcat-cache
        uses: actions/cache@v6
        with:
          path: |
            TailcatKit/build/TailcatKit.xcframework
            TailcatKit/build/tcecho
          key: ${{ runner.os }}-tailcatkit-v2-${{ hashFiles('TailcatKit/**/*.go', 'TailcatKit/go.mod', 'TailcatKit/go.sum', 'TailcatKit/build_xcframework.sh', 'TailcatKit/LICENSE.tailcat') }}

      - name: Set up Go
        if: steps.tailcat-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: TailcatKit/go.mod
          cache-dependency-path: TailcatKit/go.sum

      - name: Build TailcatKit.xcframework
        if: steps.tailcat-cache.outputs.cache-hit != 'true'
        run: ./TailcatKit/build_xcframework.sh

      - name: Build tailcat echo server
        if: steps.tailcat-cache.outputs.cache-hit != 'true'
        working-directory: TailcatKit
        run: go build -o build/tcecho ./cmd/tcecho

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Intent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM packages
        run: scripts/xcodebuild.sh resolve

      - name: Build portable test products
        env:
          TEST_ARTIFACT_PATH: ${{ runner.temp }}/ios-test-build/tests.tar.gz
          TEST_ARTIFACT_RUN: ${{ steps.configure.outputs.run }}
          TEST_ARTIFACT_REVISION: ${{ steps.configure.outputs.revision }}
        run: scripts/xcodebuild.sh build-test-artifact

      # Outputs are trusted independently of the downloaded receipt. The smoke
      # executable is separately hashed; no server/token exists on this producer.
      - name: Publish trusted checksums
        id: publish
        env:
          TEST_ARTIFACT_PATH: ${{ runner.temp }}/ios-test-build/tests.tar.gz
          TEST_ARTIFACT_RUN: ${{ steps.configure.outputs.run }}
          TEST_ARTIFACT_REVISION: ${{ steps.configure.outputs.revision }}
          TEST_BUILD_CONTEXT: ${{ steps.configure.outputs.context }}
        run: python3 scripts/ci-test-handoff.py publish

      - name: Upload portable test build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.configure.outputs.artifact }}
          path: |
            ${{ runner.temp }}/ios-test-build/tests.tar.gz
            ${{ runner.temp }}/ios-test-build/tests.tar.gz.json
            ${{ runner.temp }}/ios-test-build/tcecho
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  ios-unit-tests:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.only_testing != '' && 'iOS Filtered Worker (non-gating)' || 'iOS Unit Tests' }}
    needs: ios-test-build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RESULT_BUNDLE: TestResults
      TEST_ARTIFACT_PATH: ios-test-build/tests.tar.gz
      TEST_ARTIFACT_RUN: ${{ needs.ios-test-build.outputs.run }}
      TEST_ARTIFACT_REVISION: ${{ needs.ios-test-build.outputs.revision }}
      TEST_ARTIFACT_SHA256: ${{ needs.ios-test-build.outputs.sha256 }}
      TEST_BUILD_CONTEXT: ${{ needs.ios-test-build.outputs.context }}
      TEST_ECHO_SHA256: ${{ needs.ios-test-build.outputs.echo-sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select exact producer platform
        run: python3 scripts/ci-test-handoff.py consume

      - name: Pre-boot simulator
        run: xcrun simctl boot "$SIM_UDID" > /tmp/simboot.log 2>&1 || true &

      - name: Download same-run test build
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BUILD_NAME: ${{ needs.ios-test-build.outputs.artifact }}
        run: gh run download "$GITHUB_RUN_ID" --name "$TEST_BUILD_NAME" --dir ios-test-build

      - name: Validate tailcat echo executable
        run: python3 scripts/ci-test-handoff.py verify-echo

      # In-process tailcat echo server for the Swift smoke test; prints
      # its connection token on the first line of stdout. The token
      # reaches the simulator test process via the TEST_RUNNER_ prefix.
      # Startup fetches the public DERP map (https://tailcat.dev/derpmap.json)
      # under a 10 s deadline hard-coded inside tailcat; a single slow
      # fetch used to fail the whole job (ios#388), so a start that exits
      # early or produces no token within 30 s is retried with backoff
      # (5 s, 15 s, 30 s) and the step fails only after the last attempt,
      # naming the DERP-map fetch when tcecho's stderr blames it.
      - name: Start tailcat echo server
        working-directory: TailcatKit
        env:
          TCECHO_BIN: ${{ github.workspace }}/ios-test-build/tcecho
          TCECHO_BACKOFF: 5 15 30
        run: |
          derp_cause() {
            grep -q 'fetching DERPMap' /tmp/tcecho-err.txt 2>/dev/null
          }
          start_once() {
            : > /tmp/tcecho-token.txt
            : > /tmp/tcecho-err.txt
            "$TCECHO_BIN" > /tmp/tcecho-token.txt 2>/tmp/tcecho-err.txt &
            pid=$!
            for _ in $(seq 1 30); do
              [ -s /tmp/tcecho-token.txt ] && return 0
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" 2>/dev/null || true
                echo "tcecho exited during startup:" >&2
                sed 's/^/  /' /tmp/tcecho-err.txt >&2
                return 1
              fi
              sleep 1
            done
            echo "tcecho produced no token within 30s; stopping it:" >&2
            sed 's/^/  /' /tmp/tcecho-err.txt >&2
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            return 1
          }
          read -r -a backoff <<< "$TCECHO_BACKOFF"
          attempts=$(( ${#backoff[@]} + 1 ))
          derp_failures=0
          for attempt in $(seq 1 "$attempts"); do
            if start_once; then
              break
            fi
            if derp_cause; then
              derp_failures=$(( derp_failures + 1 ))
              echo "attempt $attempt/$attempts failed: public DERP-map fetch timed out or failed (ios#388)" >&2
            else
              echo "attempt $attempt/$attempts failed" >&2
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              if [ "$derp_failures" -eq "$attempts" ]; then
                echo "::error title=tcecho did not start::the public DERP-map fetch (https://tailcat.dev/derpmap.json) failed on all $attempts attempts; see ios#388"
              elif [ "$derp_failures" -gt 0 ]; then
                echo "::error title=tcecho did not start::tcecho failed to start after $attempts attempts; $derp_failures of them failed fetching the public DERP map (https://tailcat.dev/derpmap.json, ios#388), see the step log for the others"
              else
                echo "::error title=tcecho did not start::tcecho failed to start after $attempts attempts; see its stderr in the step log"
              fi
              exit 1
            fi
            delay=${backoff[attempt - 1]}
            echo "retrying in ${delay}s" >&2
            sleep "$delay"
          done
          token=$(head -n 1 /tmp/tcecho-token.txt)
          if [ -z "$token" ]; then
            echo "tcecho started but printed an empty token" >&2
            cat /tmp/tcecho-err.txt >&2
            exit 1
          fi
          [ "$attempt" -eq 1 ] || echo "tcecho started on attempt $attempt/$attempts"
          echo "::add-mask::$token"
          echo "TAILCAT_SMOKE_TOKEN=$token" >> "$GITHUB_ENV"

      # Diagnostics for the intermittent multi-minute stall before the test
      # host launches: show what the background boot printed and whether
      # the device is actually Booted before xcodebuild takes over.
      - name: Simulator state
        run: |
          echo "--- simctl boot output:"
          cat /tmp/simboot.log 2>/dev/null || echo "(no output)"
          echo "--- device:"
          xcrun simctl list devices | grep -F "$SIM_UDID" || true

      - name: Note test filter
        if: github.event_name == 'workflow_dispatch' && inputs.only_testing != ''
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          echo "Filtered test run (non-gating): ONLY_TESTING='$ONLY_TESTING'" >> "$GITHUB_STEP_SUMMARY"

      # The script removes any existing result bundle at RESULT_BUNDLE
      # (xcodebuild refuses an existing path). xcodebuild forwards its
      # TEST_RUNNER_-prefixed environment variables into the test process
      # (minus the prefix), carrying the tcecho token to the TailcatKit
      # smoke test. A pull_request (or unfiltered dispatch) uses the unit-only
      # subcommand, selecting all IntentTests for the catalog report. A
      # filtered workflow_dispatch retains the regular verified-selector path:
      # a selector that matches or executes nothing fails with exit 82, an
      # unverifiable selection with 83, and the per-selector table is appended
      # to the job summary (see the script header).
      - name: Run unit tests
        env:
          TEST_RUNNER_TAILCAT_SMOKE_TOKEN: ${{ env.TAILCAT_SMOKE_TOKEN }}
          ONLY_TESTING: ${{ github.event_name == 'workflow_dispatch' && inputs.only_testing || '' }}
          TEST_SELECTION_REPORT: ${{ runner.temp }}/unit-selection.json
        run: |
          if [ -n "$ONLY_TESTING" ]; then
            scripts/xcodebuild.sh test-without-building
          else
            ONLY_TESTING=IntentTests scripts/xcodebuild.sh test-without-building-unit
          fi

      # InfoPlistSyncTests, PlatformGuardAllowlistTests,
      # ObjCCallbackIsolationTests, ExternalLinkTests and
      # PrivacyManifestDriftTests inspect repository files at runtime. They
      # must read the copies packaged into IntentTests.xctest, never the
      # checkout the bundle was compiled in: that path does not exist on a
      # physical device (intent-hq/ios#320, intent-hq/ios#364,
      # intent-hq/ios#373, intent-hq/ios#381). Re-run just
      # those suites against the same build with the source tree moved aside,
      # so they can only pass by reading the bundled copies. Empty stand-in
      # directories keep the project's synchronized folders resolvable for
      # xcodebuild; a separate result bundle preserves the full run's for the
      # artifact upload.
      - name: Source-independence check (ios#320)
        env:
          RESULT_BUNDLE: TestResults-source-moved
          ONLY_TESTING: IntentTests/InfoPlistSyncTests IntentTests/PlatformGuardAllowlistTests IntentTests/ObjCCallbackIsolationTests IntentTests/ExternalLinkTests IntentTests/PrivacyManifestDriftTests
          TEST_SELECTION_REPORT: ${{ runner.temp }}/source-selection.json
        run: |
          moved="$RUNNER_TEMP/source-moved"
          mkdir -p "$moved"
          restore() {
            for p in Intent IntentTests Info-visionOS.plist; do
              [ -e "$moved/$p" ] || continue
              if [ -d "$p" ]; then rmdir "$p"; fi
              mv "$moved/$p" "$p"
            done
          }
          trap restore EXIT
          mv Intent IntentTests Info-visionOS.plist "$moved/"
          mkdir Intent IntentTests
          scripts/xcodebuild.sh test-without-building

      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-unit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults
            TestResults-retry
            TestResults-source-moved
            TestResults-source-moved-retry

      - name: Upload unit selection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-selection-${{ github.run_id }}-${{ github.run_attempt }}-unit
          path: |
            ${{ runner.temp }}/unit-selection.json
            ${{ runner.temp }}/source-selection.json
          retention-days: 7
          if-no-files-found: error

  build-and-test:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.only_testing != '' && 'iOS Filtered Tests (non-gating)' || 'iOS Build & Test' }}
    # This is still the ONLY ruleset-required gate. always() prevents failed or
    # skipped prerequisites turning it into a skipped, apparently passing check.
    # UI remains a separate visible gate; no required-check policy changes.
    needs: [ios-test-build, ios-unit-tests, go-test, swiftlint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download selection evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_KIND: unit
        run: python3 scripts/ci-test-handoff.py download-reports

      - name: Require build, unit, Go and lint success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          TEST_ARTIFACT_RUN: ${{ needs.ios-test-build.outputs.run }}
          TEST_ARTIFACT_REVISION: ${{ needs.ios-test-build.outputs.revision }}
          TEST_ARTIFACT_SHA256: ${{ needs.ios-test-build.outputs.sha256 }}
          ONLY_TESTING: ${{ github.event_name == 'workflow_dispatch' && inputs.only_testing || '' }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" \
            | python3 scripts/check-ui-test-shards.py --required "$GITHUB_RUN_ATTEMPT" selection-evidence

  ios-ui-test-shards:
    name: iOS UI Tests (shard ${{ matrix.shard }}/${{ needs.ios-test-build.outputs.count }})
    needs: ios-test-build
    # Pull requests and unfiltered manual runs exercise the complete UI bundle.
    # Filtered dispatches already run their requested selector in ios-unit-tests.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_testing != '') }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.ios-test-build.outputs.matrix) }}
    env:
      RESULT_BUNDLE: UITestResults
      UI_TEST_SHARD_COUNT: ${{ needs.ios-test-build.outputs.count }}
      TEST_ARTIFACT_PATH: ios-test-build/tests.tar.gz
      TEST_ARTIFACT_RUN: ${{ needs.ios-test-build.outputs.run }}
      TEST_ARTIFACT_REVISION: ${{ needs.ios-test-build.outputs.revision }}
      TEST_ARTIFACT_SHA256: ${{ needs.ios-test-build.outputs.sha256 }}
      TEST_BUILD_CONTEXT: ${{ needs.ios-test-build.outputs.context }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select exact producer platform
        run: python3 scripts/ci-test-handoff.py consume

      - name: Pre-boot simulator
        run: xcrun simctl boot "$SIM_UDID" > /tmp/simboot.log 2>&1 || true &

      - name: Download same-run test build
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BUILD_NAME: ${{ needs.ios-test-build.outputs.artifact }}
        run: gh run download "$GITHUB_RUN_ID" --name "$TEST_BUILD_NAME" --dir ios-test-build

      - name: Simulator state
        run: |
          echo "--- simctl boot output:"
          cat /tmp/simboot.log 2>/dev/null || echo "(no output)"
          echo "--- device:"
          xcrun simctl list devices | grep -F "$SIM_UDID" || true

      - name: Run UI tests
        env:
          UI_TEST_SHARD: ${{ matrix.shard }}
          TEST_SELECTION_REPORT: ${{ runner.temp }}/ui-selection.json
        run: scripts/xcodebuild.sh test-without-building

      - name: Upload UI selection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-selection-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-selection.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload UI test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-results-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            UITestResults
            UITestResults-retry

      # ConversationTranscriptScrollUITests attaches one content-free JSON
      # record per launch proving the unrealized-end recovery ran. Export only
      # those records on every run; full result bundles remain failure-only.
      - name: Export transcript recovery evidence
        id: recovery-evidence
        if: always()
        run: |
          out="$RUNNER_TEMP/recovery-evidence"
          mkdir -p "$out"
          count=0
          for source in "$RESULT_BUNDLE" "$RESULT_BUNDLE-retry"; do
            if [ ! -d "$source" ]; then
              echo "No result bundle at $source; nothing to export"
              continue
            fi
            dest="$out"
            [ "$source" = "$RESULT_BUNDLE" ] || dest="$out/retry"
            mkdir -p "$dest"
            bundle="$RUNNER_TEMP/recovery-evidence-$(basename "$source").xcresult"
            ln -s "$PWD/$source" "$bundle"
            exported="$RUNNER_TEMP/recovery-evidence-export-$(basename "$source")"
            mkdir -p "$exported"
            if xcrun xcresulttool export attachments --path "$bundle" --output-path "$exported" \
              && [ -f "$exported/manifest.json" ]; then
              while IFS=$'\t' read -r src name; do
                [ -n "$src" ] && [ -f "$exported/$src" ] || continue
                cp "$exported/$src" "$dest/$(printf '%s' "$name" | tr -cs 'A-Za-z0-9._-' '_')"
                count=$((count + 1))
              done < <(jq -r --arg prefix transcript-recovery-evidence- '
                .[]? | .attachments[]?
                | select(((.suggestedHumanReadableName // "") | startswith($prefix))
                         or ((.exportedFileName // "") | startswith($prefix)))
                | [.exportedFileName, (.suggestedHumanReadableName // .exportedFileName)] | @tsv
              ' "$exported/manifest.json")
            else
              echo "::warning::could not export attachments from $source"
            fi
          done
          echo "Recovery evidence records: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload transcript recovery evidence
        if: always() && steps.recovery-evidence.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: ios-transcript-recovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/recovery-evidence
          retention-days: 14
          if-no-files-found: ignore

  ios-ui-tests:
    # A skipped filtered run must not publish the stable full-coverage gate.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.only_testing != '' && 'iOS UI Tests (non-gating)' || 'iOS UI Tests' }}
    needs: [ios-test-build, ios-unit-tests, ios-ui-test-shards]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.only_testing != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download selection evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_KIND: all
        run: python3 scripts/ci-test-handoff.py download-reports

      # All attempts remain in separate artifact directories. Bind each report
      # to its job's latest successful attempt AND the trusted producer outputs.
      # If a producer is rebuilt, old consumers must not satisfy this new gate.
      - name: Require every UI shard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SHARD_RESULT: ${{ needs.ios-ui-test-shards.result }}
          EXPECTED_SHARD_COUNT: ${{ needs.ios-test-build.outputs.count }}
          TEST_ARTIFACT_RUN: ${{ needs.ios-test-build.outputs.run }}
          TEST_ARTIFACT_REVISION: ${{ needs.ios-test-build.outputs.revision }}
          TEST_ARTIFACT_SHA256: ${{ needs.ios-test-build.outputs.sha256 }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" \
            | python3 scripts/check-ui-test-shards.py "$SHARD_RESULT" "$GITHUB_RUN_ATTEMPT" "$EXPECTED_SHARD_COUNT" selection-evidence

  visionos-build:
    name: visionOS Build
    # Build-only job (no tests) keeping the xros destination green.
    # TailcatKit is linked with an iOS-only platform filter, so this job
    # needs no Go toolchain and no xcframework build. Skipped on a filtered
    # dispatch to save a macOS runner.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_testing != '') }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      # Knob for scripts/xcodebuild.sh: pin SPM clones to the cached path.
      SPM_CLONE_DIR: build/SourcePackages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Independent visionOS lane retains its existing Xcode selection.
      - name: Select Xcode
        run: |
          echo "Available Xcode bundles:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcode=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ] && [ -d "$xcode" ]; then
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            echo "Selected $xcode"
            DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
          else
            echo "No /Applications/Xcode*.app bundle found; using default: $(xcode-select -p)"
            xcodebuild -version
          fi

      # The macos-15 image is expected to ship a visionOS simulator runtime;
      # download it only if absent (several GB, so guard on presence).
      - name: Ensure visionOS simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q '^visionOS '; then
            echo "visionOS simulator runtime present:"
            xcrun simctl list runtimes | grep '^visionOS '
          else
            echo "No visionOS simulator runtime on this runner; downloading..."
            sudo xcodebuild -downloadPlatform visionOS
            xcrun simctl list runtimes | grep '^visionOS '
          fi

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Intent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM packages
        run: scripts/xcodebuild.sh resolve

      # build-visionos uses the generic visionOS Simulator destination, so
      # no concrete Vision Pro device pick is needed; the script fails fast
      # if the visionOS platform is not installed.
      - name: Build
        run: scripts/xcodebuild.sh build-visionos

  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
