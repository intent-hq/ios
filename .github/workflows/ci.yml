name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # Kick off the simulator boot early so it overlaps with package
      # resolution and compilation instead of delaying the test step.
      # Run in the background: simctl boot can block for minutes waiting for
      # the device to reach the Booted state, but CoreSimulator completes the
      # boot on its own and xcodebuild waits for it if still in progress.
      - name: Pre-boot simulator
        run: xcrun simctl boot 'iPhone 16' >/dev/null 2>&1 || true &

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Intent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Intent.xcodeproj
          -scheme Intent

      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -project Intent.xcodeproj
          -scheme Intent
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: >
          xcodebuild test-without-building
          -project Intent.xcodeproj
          -scheme Intent
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -parallel-testing-enabled NO
          -resultBundlePath TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults

  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
