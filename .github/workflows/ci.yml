name: Keyboard prerequisite proof (scratch)

# Scratch branch only. Never merge this workflow override.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    name: Wrapper tests and SwiftLint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test_xcodebuild.sh
      - run: scripts/check-swiftlint-inputs.sh
      - run: scripts/setup-swiftlint.sh
      - run: scripts/swiftlint.sh

  keyboard:
    name: Native keyboard prerequisite controls
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      TEST_CRASH_RETRY: '0'
      SIM_LOCK_TIMEOUT: '0'
      TEST_RUNNER_INTENT_UITEST_FULL_GATE_REPRO: '1'
      ONLY_TESTING: >-
        IntentUITests/ConversationTranscriptScrollUITests/testKeyboardOpenKeepsTranscriptAtEnd
        IntentUITests/ConversationTranscriptScrollUITests/testSoftwareKeyboardPrerequisiteSkipsWhenKeyboardIsAbsent
      RESULT_BUNDLE: KeyboardPrerequisite.xcresult
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: TailcatKit/go.mod
          cache-dependency-path: TailcatKit/go.sum
      - name: Select the existing Xcode 26.3 installation
        run: |
          test -d /Applications/Xcode_26.3.app
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
          echo "DERIVED_DATA_DIR=$RUNNER_TEMP/b58i-derived-data" >> "$GITHUB_ENV"
      - name: Record source and simulator provenance
        run: |
          mkdir evidence
          {
            date -u
            git show -s --format='%H%n%P%n%s' HEAD
            git diff HEAD^ --stat
            xcodebuild -version
            sw_vers
            uptime
            xcrun simctl list runtimes
          } > evidence/provenance.txt
          udid=$(scripts/xcodebuild.sh pick-simulator)
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "SIM_UDID=$udid" >> evidence/provenance.txt
          defaults read com.apple.iphonesimulator > evidence/simulator-preferences.txt 2>&1 || true
      - name: Run the two native controls once
        run: |
          set -o pipefail
          scripts/xcodebuild.sh test-ios 2>&1 | tee evidence/test.log
      - name: Preserve results and require actual passes
        if: always()
        run: |
          test -d KeyboardPrerequisite.xcresult
          xcrun xcresulttool get test-results tests --path KeyboardPrerequisite.xcresult > evidence/tests.json
          xcrun xcresulttool export attachments --path KeyboardPrerequisite.xcresult --output-path evidence/attachments
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "ConversationTranscriptScrollUITests/testKeyboardOpenKeepsTranscriptAtEnd",
              "ConversationTranscriptScrollUITests/testSoftwareKeyboardPrerequisiteSkipsWhenKeyboardIsAbsent",
          }
          rows = []

          def walk(nodes):
              for node in nodes:
                  if node.get("nodeType") == "Test Case":
                      identity = str(node.get("nodeIdentifier") or node.get("name") or "").removesuffix("()")
                      rows.append((identity, node.get("result")))
                  walk(node.get("children", []))

          walk(json.loads(Path("evidence/tests.json").read_text())["testNodes"])
          print(rows)
          assert len(rows) == 2, "Expected exactly two executed controls"
          for test in expected:
              assert len([row for row in rows if row[0].endswith(test) and row[1] == "Passed"]) == 1, test
          print("Both controls passed; the unfocused absence control is not a post-focus issue #385 reproduction.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keyboard-prerequisite-evidence
          path: |
            evidence
            KeyboardPrerequisite.xcresult
          retention-days: 14
          if-no-files-found: error
