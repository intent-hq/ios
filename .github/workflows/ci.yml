name: CI
# No push-to-main trigger: the repo ruleset requires PR branches to be up to
# date with main before merging, so the squash commit that lands on main has
# the identical tree the PR CI just tested. A post-merge re-run adds no signal.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS Build & Test
    # GitHub-hosted arm64 macOS runner; ships Xcode and iOS simulator
    # runtimes preinstalled. Timeout allows a cold SPM resolve + full build
    # on the 3-core M-series VM.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      # Knobs for scripts/xcodebuild.sh: pin SPM clones to the cached path
      # and write the test result bundle where the artifact upload expects it.
      SPM_CLONE_DIR: build/SourcePackages
      RESULT_BUNDLE: TestResults
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Select the newest Xcode*.app bundle on the image: the Textual
      # dependency needs a recent toolchain (its own CI builds iOS on
      # Xcode 26.5), so older bundles hit a Swift 6.0 concurrency
      # false-positive compiling Table.swift. List every bundle first for
      # diagnostics. DEVELOPER_DIR needs no sudo.
      - name: Select Xcode
        run: |
          echo "Available Xcode bundles:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcode=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ] && [ -d "$xcode" ]; then
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            echo "Selected $xcode"
            DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
          else
            echo "No /Applications/Xcode*.app bundle found; using default: $(xcode-select -p)"
            xcodebuild -version
          fi

      # Device selection lives in scripts/xcodebuild.sh (pick-simulator).
      # Export the UDID so the pre-boot step and every later script
      # invocation share one concrete device.
      - name: Pick simulator device
        run: echo "SIM_UDID=$(scripts/xcodebuild.sh pick-simulator)" >> "$GITHUB_ENV"

      # Kick off the simulator boot early so it overlaps with package
      # resolution and compilation instead of delaying the test step.
      # Run in the background: simctl boot can block for minutes waiting for
      # the device to reach the Booted state, but CoreSimulator completes the
      # boot on its own and xcodebuild waits for it if still in progress.
      - name: Pre-boot simulator
        run: xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true &

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: TailcatKit/go.mod
          cache-dependency-path: TailcatKit/go.sum

      - name: Go unit tests (TailcatKit)
        working-directory: TailcatKit
        run: go test -timeout 300s ./...

      # The gomobile bind output is deterministic for a given wrapper
      # source + module graph + Go toolchain, so cache the xcframework
      # on a hash of those inputs. go.mod is included because it picks
      # the toolchain (setup-go go-version-file) and module versions.
      - name: Cache TailcatKit.xcframework
        id: tailcat-cache
        uses: actions/cache@v6
        with:
          path: TailcatKit/build/TailcatKit.xcframework
          key: ${{ runner.os }}-tailcatkit-${{ hashFiles('TailcatKit/**/*.go', 'TailcatKit/go.mod', 'TailcatKit/go.sum', 'TailcatKit/build_xcframework.sh') }}

      - name: Build TailcatKit.xcframework
        if: steps.tailcat-cache.outputs.cache-hit != 'true'
        run: ./TailcatKit/build_xcframework.sh

      # In-process tailcat echo server for the Swift smoke test; prints
      # its connection token on the first line of stdout. The token
      # reaches the simulator test process via the TEST_RUNNER_ prefix.
      - name: Start tailcat echo server
        working-directory: TailcatKit
        run: |
          go build -o /tmp/tcecho ./cmd/tcecho
          /tmp/tcecho > /tmp/tcecho-token.txt 2>/tmp/tcecho-err.txt &
          pid=$!
          for i in $(seq 1 30); do
            [ -s /tmp/tcecho-token.txt ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "tcecho exited during startup:" >&2
              cat /tmp/tcecho-err.txt >&2
              exit 1
            fi
            sleep 1
          done
          token=$(head -n 1 /tmp/tcecho-token.txt)
          if [ -z "$token" ]; then
            echo "tcecho failed to start" >&2
            cat /tmp/tcecho-err.txt >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "TAILCAT_SMOKE_TOKEN=$token" >> "$GITHUB_ENV"

      # Ephemeral runner: cache SPM checkouts across runs. SPM_CLONE_DIR
      # (job env above) makes scripts/xcodebuild.sh pin
      # -clonedSourcePackagesDirPath to the cached path so the cache key
      # actually covers what gets written.
      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Intent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM packages
        run: scripts/xcodebuild.sh resolve

      - name: Build for testing
        run: scripts/xcodebuild.sh build-for-testing

      # The script removes any existing result bundle at RESULT_BUNDLE
      # (xcodebuild refuses an existing path). xcodebuild forwards its
      # TEST_RUNNER_-prefixed environment variables into the test process
      # (minus the prefix), carrying the tcecho token to the TailcatKit
      # smoke test.
      - name: Run unit tests
        env:
          TEST_RUNNER_TAILCAT_SMOKE_TOKEN: ${{ env.TAILCAT_SMOKE_TOKEN }}
        run: scripts/xcodebuild.sh test-without-building

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults

  visionos-build:
    name: visionOS Build
    # Build-only job (no tests) keeping the xros destination green.
    # TailcatKit is linked with an iOS-only platform filter, so this job
    # needs no Go toolchain and no xcframework build.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      # Knob for scripts/xcodebuild.sh: pin SPM clones to the cached path.
      SPM_CLONE_DIR: build/SourcePackages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Xcode selection logic as the iOS job above.
      - name: Select Xcode
        run: |
          echo "Available Xcode bundles:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcode=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ] && [ -d "$xcode" ]; then
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            echo "Selected $xcode"
            DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
          else
            echo "No /Applications/Xcode*.app bundle found; using default: $(xcode-select -p)"
            xcodebuild -version
          fi

      # The macos-15 image is expected to ship a visionOS simulator runtime;
      # download it only if absent (several GB, so guard on presence).
      - name: Ensure visionOS simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q '^visionOS '; then
            echo "visionOS simulator runtime present:"
            xcrun simctl list runtimes | grep '^visionOS '
          else
            echo "No visionOS simulator runtime on this runner; downloading..."
            sudo xcodebuild -downloadPlatform visionOS
            xcrun simctl list runtimes | grep '^visionOS '
          fi

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Intent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM packages
        run: scripts/xcodebuild.sh resolve

      # build-visionos uses the generic visionOS Simulator destination, so
      # no concrete Vision Pro device pick is needed; the script fails fast
      # if the visionOS platform is not installed.
      - name: Build
        run: scripts/xcodebuild.sh build-visionos

  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
