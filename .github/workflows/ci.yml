name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS Build & Test
    # Self-hosted M1 Mac (Xcode 16.2 at /Applications/Xcode.app, iOS 18.3
    # simulator runtime). m1mac is a single runner slot shared with intentd's
    # release-sitter macOS builds, so jobs serialize behind whatever else is
    # queued there; the workflow-level concurrency group above keeps stacked
    # PR pushes from piling onto the queue.
    # Revert: switch runs-on back to macos-15 (GitHub-hosted) and restore the
    # actions/cache step for build/SourcePackages in place of SPM_CACHE_DIR.
    runs-on: [self-hosted, macOS, ARM64, m1mac]
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Prefer Xcode 16.4 when its versioned bundle exists, else the newest
      # Xcode*.app bundle (m1mac: /Applications/Xcode.app, 16.2), else the
      # default toolchain. DEVELOPER_DIR needs no sudo.
      - name: Select Xcode
        run: |
          xcode=/Applications/Xcode_16.4.app
          if [ ! -d "$xcode" ]; then
            xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -n "$xcode" ] && [ -d "$xcode" ]; then
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            echo "Selected $xcode"
            DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
          else
            echo "No /Applications/Xcode*.app bundle found; using default: $(xcode-select -p)"
            xcodebuild -version
          fi

      # Persistent host: a crashed earlier run can leave simulators booted
      # and holding memory. Start from a clean slate before picking a device.
      - name: Shut down leftover simulators
        run: xcrun simctl shutdown all 2>/dev/null || true

      # Prefer the iPhone 16 simulator, else any available iPhone on this
      # runner; fail early with a clear message if there is none. Select by
      # UDID: it keeps parenthesized names (e.g. "iPhone SE (3rd generation)")
      # intact, disambiguates duplicate names across runtimes, and pins the
      # destination to one concrete device. tail -n 1 prefers the newest
      # installed runtime (simctl groups devices by runtime, oldest first).
      - name: Pick simulator device
        run: |
          devices=$(xcrun simctl list devices available)
          line=$(echo "$devices" | grep -E '^[[:space:]]+iPhone 16 \(' | tail -n 1 || true)
          if [ -z "$line" ]; then
            line=$(echo "$devices" | grep -E '^[[:space:]]+iPhone' | tail -n 1 || true)
          fi
          udid=$(echo "$line" | grep -oE '[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}' | head -n 1 || true)
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator on this runner" >&2
            exit 1
          fi
          name=$(echo "$line" | sed -E "s/^[[:space:]]*(.*) \($udid\).*/\1/")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "Selected simulator: $name ($udid)"

      # Kick off the simulator boot early so it overlaps with package
      # resolution and compilation instead of delaying the test step.
      # Run in the background: simctl boot can block for minutes waiting for
      # the device to reach the Booted state, but CoreSimulator completes the
      # boot on its own and xcodebuild waits for it if still in progress.
      - name: Pre-boot simulator
        run: xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true &

      # Persistent runner: keep SPM checkouts in a host-local cache dir
      # instead of actions/cache (no tarball download/upload per run). m1mac
      # is a single runner slot, so there are no concurrent writers. Derived
      # data stays at build/DerivedData inside the workspace, which checkout's
      # default clean wipes each run — no state leaks between runs and
      # ~/Library/Developer doesn't grow unbounded.
      - name: Set up SPM cache dir
        run: |
          spm_cache="$HOME/Library/Caches/intent-ios-ci/SourcePackages"
          mkdir -p "$spm_cache"
          echo "SPM_CACHE_DIR=$spm_cache" >> "$GITHUB_ENV"

      - name: Resolve SPM packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Intent.xcodeproj
          -scheme Intent
          -clonedSourcePackagesDirPath "$SPM_CACHE_DIR"
          -derivedDataPath build/DerivedData

      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -project Intent.xcodeproj
          -scheme Intent
          -destination "platform=iOS Simulator,id=$SIM_UDID"
          -clonedSourcePackagesDirPath "$SPM_CACHE_DIR"
          -derivedDataPath build/DerivedData
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      # rm keeps the step independent of checkout's clean setting:
      # xcodebuild refuses an existing result bundle path.
      - name: Run unit tests
        run: |
          rm -rf TestResults
          xcodebuild test-without-building \
            -project Intent.xcodeproj \
            -scheme Intent \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_DIR" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults

      # Leave the persistent host clean even when a step above failed.
      - name: Shut down simulators
        if: always()
        run: xcrun simctl shutdown all 2>/dev/null || true

  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
