# Use SwiftLint's default rules plus this explicit opt-in set. Keeping the set
# explicit prevents local SwiftLint and the Xcode plugin from drifting when
# their bundled rule catalogs differ; no blanket `disabled_rules` list or
# baseline hides findings.
opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - anonymous_argument_in_multiline_closure
  - array_init
  - async_without_await
  - balanced_xctest_lifecycle
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_object_literal
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - expiring_todo
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name_no_space
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - function_default_parameter_at_end
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - legacy_uigraphics_function
  - let_var_whitespace
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_call_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - no_magic_numbers
  - non_overridable_class_declaration
  - nslocalizedstring_key
  - number_separator
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - period_spacing
  - prefer_asset_symbols
  - prefer_condition_list
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - private_subject
  - private_swiftui_state
  - prohibited_interface_builder
  - prohibited_super_call
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - redundant_final
  - redundant_nil_coalescing
  - redundant_self
  - redundant_type_annotation
  - required_enum_case
  - return_value_from_void_function
  - self_binding
  - shorthand_argument
  - shorthand_optional_binding
  - single_test_class
  - sorted_enum_cases
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - superfluous_else
  - test_case_accessibility
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_escaping
  - unneeded_parentheses_in_closure_argument
  - unneeded_throws_rethrows
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_parameter
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

included:
  - Intent
  - IntentTests
  - IntentUITests

allow_zero_lintable_files: false
check_for_updates: false

line_length: 225
type_body_length:
  warning: 300
file_length:
  warning: 500
type_name:
  min_length: 4
  max_length: 40
  excluded:
    - iPhone
    - Tab
  allowed_symbols: ["_"]
identifier_name:
  min_length:
    error: 3
  allowed_symbols: ["_"]
  excluded:
    - up
    - id
    - p
    - i
    - x
    - y
number_separator:
  minimum_length: 5
no_magic_numbers:
  allowed_numbers: [0.0, 1.0, 100.0, 0.5, 2.0]
reporter: "xcode"
custom_rules:
  generic_button_style:
    name: "Use Intent Button Styles"
    # Match only the code token; lookahead keeps strings/comments out of the
    # matched range while accepting whitespace and line breaks in the call.
    # Constructors are also rejected outside buttonStyle (e.g. stored styles).
    regex: '\b(?:buttonStyle(?=\s*\(\s*\.\s*(?:plain|bordered|borderedProminent|borderless|automatic|glass|glassProminent|link)\b)|(?:Plain|Bordered|BorderedProminent|Borderless|Default|Glass|GlassProminent|Link)ButtonStyle(?=\s*(?:\.\s*init\s*)?\())'
    message: "Use IntentContentButtonStyle() for labels that own their layout and colors, or IntentButtonStyle for filled actions. Generic SwiftUI button styles can add unwanted enabled/disabled effects."
    match_kinds:
      - identifier
      - typeidentifier
    severity: error
  intent_system_icon:
    name: "Use Intent Icon Assets"
    # Deliberately limited to Image calls with literal, exact equivalents.
    # Native Label/Button systemImage arguments and other symbols stay allowed.
    regex: '\bImage(?=\s*(?:\.\s*init\s*)?\(\s*systemName\s*:\s*"(?:plus|xmark|magnifyingglass|ellipsis|eye|eye\.slash)"\s*\))'
    message: "Use Intent assets: Image(.addIcon) for plus, Image(.close) for xmark, Image(.search) for magnifyingglass, Image(.more) for ellipsis, Image(.eye) for eye, or Image(.eyeClosed) for eye.slash. Preserve the control's accessibility label."
    match_kinds:
      - identifier
      - typeidentifier
    severity: error
  geometry_reader_usage:
    name: "GeometryReader Is Banned"
    regex: '\bGeometryReader\b'
    message: "GeometryReader is banned. Use onGeometryChange, containerRelativeFrame, Shape.path(in:), or a custom Layout. Do not suppress this rule."
    match_kinds:
      - typeidentifier
      - identifier
    severity: error
  launch_options_only:
    name: "Read Launch Options Through LaunchOptions"
    # Test targets may set up their own launches; only app code is checked.
    # Excluded by path segment so a checkout under a directory named Intent
    # still lints IntentTests and IntentUITests as test code.
    regex: '\bProcessInfo\s*\.\s*processInfo\s*\.\s*(?:arguments|environment)\b'
    message: "Read launch arguments and environment through LaunchOptions.current instead of ProcessInfo.processInfo."
    match_kinds:
      - identifier
      - typeidentifier
    excluded:
      - '/IntentTests/'
      - '/IntentUITests/'
      - '/Intent/Utils/LaunchOptions\.swift$'
    severity: error
